<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HuggingMask B-2 Sandbox Evidence</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#17202a;font-family:"Segoe UI",system-ui,sans-serif}.topbar{background:#10202f;color:#fff;padding:20px 28px}.topbar h1{margin:0;font-size:22px;font-weight:650;letter-spacing:0}.topbar p{margin:5px 0 0;color:#b8c4cf;font-size:13px}.wrap{max-width:1180px;margin:0 auto;padding:22px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.toolbar code{font-size:12px;color:#5b6670}.btn{border:0;border-radius:6px;background:#1f6feb;color:#fff;font-weight:650;font-size:13px;padding:9px 14px;cursor:pointer}.btn:hover{background:#1657bd}.panel{background:#fff;border:1px solid #dbe1e7;border-radius:8px;margin-bottom:16px;overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid #e7ebef}.panel-head h2{margin:0;font-size:15px}.panel-body{padding:16px}.proof-chain{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.proof-step{border:1px solid #dbe1e7;border-radius:8px;padding:12px;background:#fbfcfd;min-height:92px}.proof-step .k{font-size:11px;text-transform:uppercase;color:#66717c;font-weight:700}.proof-step .v{font-size:17px;font-weight:750;margin-top:7px;word-break:break-word}.proof-step.ok{border-color:#8cc8aa;background:#f0faf5}.proof-step.review{border-color:#d9b15d;background:#fff8e8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.kv{display:grid;grid-template-columns:180px 1fr;gap:8px 12px;font-size:13px}.kv div:nth-child(odd){color:#65717d;font-weight:650}.kv div:nth-child(even){font-family:Consolas,"SFMono-Regular",monospace;word-break:break-all}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:750}.badge.ok{background:#dff5ea;color:#17633d}.badge.review{background:#fff0c4;color:#7b5600}.badge.off{background:#ffe3e3;color:#9b1c1c}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{border-bottom:1px solid #e7ebef;padding:9px;text-align:left}.table th{font-size:11px;text-transform:uppercase;color:#65717d;background:#fbfcfd}.file-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.file-list code{display:block;background:#f7f9fb;border:1px solid #dbe1e7;border-radius:6px;padding:8px;font-size:12px;word-break:break-all}.empty{padding:28px;text-align:center;color:#65717d}.small{font-size:12px;color:#65717d}@media(max-width:900px){.proof-chain,.grid,.file-list{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="topbar">
  <h1>HuggingMask B-2 Sandbox Evidence</h1>
  <p>Docker Desktop desktop-linux + runsc 실행 증거를 최신 evidence 폴더에서 읽어 보여줍니다.</p>
</header>
<main class="wrap">
  <div class="toolbar">
    <div>
      <strong>Latest evidence</strong>
      <code id="evidence-dir">loading...</code>
    </div>
    <button class="btn" onclick="loadEvidence()">Refresh</button>
  </div>

  <section class="panel">
    <div class="panel-head">
      <h2>Proof Chain</h2>
      <span class="small">host-side inspect + runner diagnostics</span>
    </div>
    <div class="panel-body" id="proof-chain"></div>
  </section>

  <div class="grid">
    <section class="panel">
      <div class="panel-head"><h2>Summary</h2></div>
      <div class="panel-body"><div class="kv" id="summary"></div></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>Runtime Evidence</h2></div>
      <div class="panel-body"><div class="kv" id="runtime"></div></div>
    </section>
  </div>

  <section class="panel">
    <div class="panel-head"><h2>Docker Inspect</h2></div>
    <div class="panel-body">
      <div class="kv" id="inspect"></div>
      <table class="table" style="margin-top:14px">
        <thead><tr><th>Mount</th><th>Mode</th><th>RW</th></tr></thead>
        <tbody id="mounts"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Runner Result</h2></div>
    <div class="panel-body"><div class="kv" id="runner"></div></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>Evidence Files</h2></div>
    <div class="panel-body"><div class="file-list" id="files"></div></div>
  </section>
</main>
<script>
const API_URL = window.location.origin + "/internal/v1/sandbox/b2/latest";

function text(value){
  if(value === true) return "true";
  if(value === false) return "false";
  if(value === null || value === undefined || value === "") return "-";
  if(Array.isArray(value)) return value.join(", ");
  return String(value);
}

function badge(value, okValue){
  const ok = value === okValue || value === true;
  const cls = ok ? "ok" : "off";
  return '<span class="badge '+cls+'">'+text(value)+'</span>';
}

function decisionBadge(value){
  const cls = value === "B2_POLICY_REVIEW_REQUIRED" ? "review" : "off";
  return '<span class="badge '+cls+'">'+text(value)+'</span>';
}

function renderKv(id, rows){
  const el = document.getElementById(id);
  el.innerHTML = rows.map(([k,v]) => '<div>'+k+'</div><div>'+v+'</div>').join("");
}

function renderProof(data){
  const s = data.summary || {};
  const r = data.runtime_evidence || {};
  const i = data.docker_inspect || {};
  const steps = [
    ["Docker context", "desktop-linux", "ok"],
    ["Docker runtime", text(i.runtime || r.runtime), (i.runtime || r.runtime) === "runsc" ? "ok" : "off"],
    ["Sandbox limits", "network none / read-only", r.network_mode === "none" && r.rootfs_readonly === true ? "ok" : "off"],
    ["Runner forward", text(s.forward_status), s.forward_status === "success" ? "ok" : "off"],
    ["Final decision", text(s.decision), s.decision === "B2_POLICY_REVIEW_REQUIRED" ? "review" : "off"],
  ];
  document.getElementById("proof-chain").innerHTML =
    '<div class="proof-chain">' + steps.map(([k,v,cls]) =>
      '<div class="proof-step '+cls+'"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'
    ).join("") + '</div>';
}

function render(data){
  if(!data.available){
    document.getElementById("evidence-dir").textContent = "none";
    document.getElementById("proof-chain").innerHTML = '<div class="empty">B-2 evidence가 아직 없습니다. demo script를 먼저 실행하세요.</div>';
    return;
  }
  const s = data.summary || {};
  const r = data.runtime_evidence || {};
  const i = data.docker_inspect || {};
  const rr = data.runner_result || {};
  document.getElementById("evidence-dir").textContent = data.evidence_dir;
  renderProof(data);
  renderKv("summary", [
    ["repo_path", text(s.repo_path)],
    ["grade", text(s.grade)],
    ["route", text(s.route)],
    ["status", text(s.status)],
    ["docker_runtime", badge(s.docker_runtime, "runsc")],
    ["runtime_verified", badge(s.runtime_verified, true)],
    ["decision", decisionBadge(s.decision)],
    ["deployable", badge(s.deployable, false)],
  ]);
  renderKv("runtime", [
    ["runtime", badge(r.runtime, "runsc")],
    ["network_mode", badge(r.network_mode, "none")],
    ["rootfs_readonly", badge(r.rootfs_readonly, true)],
    ["cap_drop_all", badge(r.cap_drop_all, true)],
    ["no_new_privileges", badge(r.no_new_privileges, true)],
    ["mounts_ok", badge(r.mounts_ok, true)],
    ["non_root_user", badge(r.non_root_user, true)],
    ["env_allowlist_ok", badge(r.env_allowlist_ok, true)],
  ]);
  renderKv("inspect", [
    ["Runtime", badge(i.runtime, "runsc")],
    ["NetworkMode", badge(i.network_mode, "none")],
    ["ReadonlyRootfs", badge(i.rootfs_readonly, true)],
    ["CapDrop", text(i.cap_drop)],
    ["SecurityOpt", text(i.security_opt)],
    ["User", text(i.user)],
  ]);
  document.getElementById("mounts").innerHTML = (i.mounts || []).map(m =>
    '<tr><td>'+text(m.destination)+'</td><td>'+text(m.mode)+'</td><td>'+text(m.rw)+'</td></tr>'
  ).join("");
  renderKv("runner", [
    ["manifest_verified", badge(rr.manifest_verified, true)],
    ["import_status", badge(rr.import_status, "success")],
    ["instantiate_status", badge(rr.instantiate_status, "success")],
    ["forward_status", badge(rr.forward_status, "success")],
    ["exception_class", text(rr.exception_class)],
    ["exception_message", text(rr.exception_message)],
  ]);
  document.getElementById("files").innerHTML = Object.entries(data.files || {}).map(([k,v]) =>
    '<code>'+k+': '+v+'</code>'
  ).join("");
}

async function loadEvidence(){
  try{
    const response = await fetch(API_URL);
    render(await response.json());
  }catch(error){
    document.getElementById("proof-chain").innerHTML = '<div class="empty">evidence API를 불러오지 못했습니다.</div>';
  }
}

loadEvidence();
</script>
</body>
</html>
